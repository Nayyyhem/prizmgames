<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the canvas reaches under the notch; user-scalable=no because a
       pinch-zoom on a canvas app just breaks the pointer mapping -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                                 user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#15171c">
  <title>UI Shapes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #15171c;
      /* stop the browser from stealing drags as scroll/refresh gestures - sliders need them */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-text-size-adjust: 100%;
    }

    #unity-container {
      position: fixed;
      inset: 0;
    }

    /* The canvas fills the viewport rather than sitting in a fixed-aspect letterbox, which is
       what lets the portrait layout use the whole screen. */
    #unity-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #15171c;
      outline: none;
      touch-action: none;
    }

    #unity-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #d8dde5;
      background: #15171c;
      transition: opacity 0.35s ease;
    }

    #unity-loading.hidden { opacity: 0; pointer-events: none; }

    #unity-loading .title { font-size: 17px; letter-spacing: 0.02em; font-weight: 600; }
    #unity-loading .hint { font-size: 13px; color: #7d8694; }

    #unity-bar {
      width: min(260px, 62vw);
      height: 6px;
      border-radius: 3px;
      background: #262a33;
      overflow: hidden;
    }

    #unity-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4f8cf0, #8a6cf0);
      transition: width 0.15s ease;
    }

    #unity-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #e5b3b3;
      background: #15171c;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading">
      <div class="title">UI Shapes</div>
      <div id="unity-bar"><div id="unity-bar-fill"></div></div>
      <div class="hint">Loading…</div>
    </div>

    <div id="unity-error"></div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var barFill = document.querySelector("#unity-bar-fill");
    var errorBox = document.querySelector("#unity-error");

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/WebGL-Playground.data.gz",
      frameworkUrl: buildUrl + "/WebGL-Playground.framework.js.gz",
      codeUrl: buildUrl + "/WebGL-Playground.wasm.gz",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "PRIZM GAMES",
      productName: "UI Shapes",
      productVersion: "0.1",
      // A DPR-3 phone would otherwise back a full-screen canvas with ~9x the pixels of a DPR-1
      // one. The effects here are fill-bound, so that is the difference between smooth and not.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (msg, type) {
        if (type === "error") {
          errorBox.style.display = "flex";
          errorBox.textContent = msg;
        } else {
          console.warn(msg);
        }
      }
    };

    // Size the canvas explicitly from the window. Leaving it to Unity's matchWebGLToCanvasSize
    // rendered the game into a corner of an otherwise correctly-sized canvas, so the drawing
    // buffer and the CSS box are both set here and kept in step. Runs again after the instance
    // exists, and twice on rotation because iOS Safari reports the old size on the first event.
    var unityInstance = null;

    // Measure the canvas as LAID OUT (clientWidth/Height driven by the 100%/100% CSS), never from
    // window.innerWidth/innerHeight. The window values can differ from the final layout at the
    // moment this first runs - that mismatch is what left the game rendering into part of the
    // canvas with a dead band around it.
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w = Math.max(1, canvas.clientWidth);
      var h = Math.max(1, canvas.clientHeight);
      var bw = Math.floor(w * dpr);
      var bh = Math.floor(h * dpr);

      if (canvas.width === bw && canvas.height === bh) return;

      canvas.width = bw;
      canvas.height = bh;

      if (unityInstance && unityInstance.Module && unityInstance.Module.setCanvasSize) {
        unityInstance.Module.setCanvasSize(bw, bh);
      }
    }

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", function () {
      resize();
      setTimeout(resize, 300);
    });

    // Catches every layout change, including the ones that fire no window resize event (browser
    // chrome settling, an embedding frame resizing, iOS Safari's toolbar collapsing).
    if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);

    // MUST run before createUnityInstance: a canvas with no width/height attributes is 300x150,
    // and Unity locks its screen size to whatever the canvas is at init.
    resize();

    // block double-tap zoom, which otherwise fights repeated taps on the segmented controls
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

    var script = document.createElement("script");
    script.src = buildUrl + "/WebGL-Playground.loader.js";
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        barFill.style.width = (100 * progress) + "%";
      }).then(function (instance) {
        unityInstance = instance;
        loading.classList.add("hidden");
        setTimeout(function () { loading.style.display = "none"; }, 400);
        resize();
      }).catch(function (message) {
        errorBox.style.display = "flex";
        errorBox.textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
